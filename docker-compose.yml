version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: arabic_platform_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: arabic_platform
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d arabic_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: arabic-teacher-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arabic_platform_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://postgres:password@postgres:5432/arabic_platform
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_in_production}
      JWT_EXPIRES_IN: 7d
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:4200
    ports:
      - "5000:5000"

volumes:
  pgdata:
